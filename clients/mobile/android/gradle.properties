org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Kotlin incremental caches break when the project (D:) and the pub cache (C:) sit on different
# drives on Windows ("Could not close incremental caches"). Full compiles are fast enough here.
kotlin.incremental=false
