# Builds the Android app and publishes it as the "android-latest" GitHub release, which is what
# the website's "Download" button on Android phones points at:
#   https://github.com/Manik400/ParkNest/releases/download/android-latest/parknest.apk
#
# Release builds talk to the hosted API on Render (AppConfig.hostedApi). Signing uses the
# ANDROID_KEYSTORE_* secrets when present (scripts/setup-android-signing.ps1 creates them), so each
# new APK installs as an update over the last one. Without them the APK is signed with this
# runner's throwaway debug key: it still installs, but people must uninstall before updating.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a debug key. Run scripts/setup-android-signing.ps1."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        # The run number becomes the versionCode, so Android sees every build as newer.
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=PARKNEST_API_BASE_URL=https://parknest.onrender.com

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk parknest.apk
          notes="Android build ${{ github.run_number }} from ${GITHUB_SHA::7}. Talks to https://parknest.onrender.com."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest parknest.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest parknest.apk --title "ParkNest for Android" --notes "$notes" --latest
          fi
