# The two conditions worth waking someone for, and one worth reading in the morning.
#
# Deliberately few. An alert nobody acts on trains people to ignore the ones that matter, and
# everything else on the dashboard is a question rather than an answer.
groups:
  - name: parknest-money
    rules:
      # Wallet balances are a cached projection of the ledger. Any gap between them means the
      # projection and the truth disagree about someone's money, which is an incident rather than
      # a slow day — and it is the one number in this system that should be exactly zero.
      - alert: LedgerDrift
        expr: parknest_reconciliation_drift_credits > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Wallet balances no longer match the ledger"
          description: >-
            The hourly sweep replayed every wallet from its entries and found
            {{ $value }} credits of drift. Stop issuing payouts until it is explained.

      # A shortfall is a renter who left owing credits. One is a fact of life; a rate of them
      # means detection or the overstay meter is letting people run up debts.
      - alert: ShortfallRateHigh
        expr: >-
          sum(rate(parknest_sessions_ended_total{outcome="violation"}[30m]))
          / clamp_min(sum(rate(parknest_sessions_ended_total[30m])), 0.001) > 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of sessions are ending in a shortfall"
          description: >-
            The prepaid model rests on credits being reserved before the car arrives. A sustained
            violation rate means holds are too small, or the meter is not billing over-runs early
            enough.

      # Not urgent, but a rising dispute rate is how a detection tier tells you it is not good
      # enough — that is exactly why PRD §17 asks for it.
      - alert: DisputeRateElevated
        expr: >-
          sum(rate(parknest_disputes_raised_total[6h]))
          / clamp_min(sum(rate(parknest_bookings_created_total[6h])), 0.001) > 0.02
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Disputes are running above 2% of bookings"
